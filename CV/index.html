<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>Kota Venkata Bharghav — CV</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #5c6270;
    --line: #e2e5ea;
    --accent: #1f5fd0;
    --card: #f7f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8eaee;
      --muted: #9aa1af;
      --line: #2a2e36;
      --accent: #6ea3ff;
      --card: #1b1e24;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 20px;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
  }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.92rem; margin: 0; }
  .spacer { flex: 1 1 auto; }
  .btn {
    display: inline-block;
    padding: 9px 18px;
    border-radius: 7px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.08); }
  main {
    flex: 1 1 auto;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 24px 32px;
    display: flex;
    flex-direction: column;
  }
  .viewer {
    flex: 1 1 auto;
    min-height: 78vh;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--card);
  }
  .viewer object, .viewer iframe { width: 100%; height: 100%; border: 0; display: block; }
  .fallback { padding: 40px 24px; text-align: center; color: var(--muted); }
  footer {
    padding: 16px 24px 28px;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    color: var(--muted);
    font-size: 0.82rem;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Kota Venkata Bharghav</h1>
      <p class="sub">3D Vision · Event-Based Computing · Robotics</p>
    </div>
    <div class="spacer"></div>
    <a class="btn" href="Kota_Venkata_Bharghav_CV.pdf" download>Download CV (PDF)</a>
  </header>

  <main>
    <div class="viewer">
      <object data="Kota_Venkata_Bharghav_CV.pdf#view=FitH" type="application/pdf">
        <div class="fallback">
          <p>Your browser can&rsquo;t display the PDF inline.</p>
          <p><a href="Kota_Venkata_Bharghav_CV.pdf">Open the CV directly</a></p>
        </div>
      </object>
    </div>
  </main>

  <footer>
    Curriculum vitae &middot; last updated March 2026
  </footer>
</body>
</html>
