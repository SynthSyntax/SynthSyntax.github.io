<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kota Venkata Bharghav</title>
<style>
  :root { --bg:#ffffff; --fg:#16181d; --muted:#5c6270; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#e8eaee; --muted:#9aa1af; }
  }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  h1 { font-size:1.35rem; font-weight:600; margin:0 0 6px; letter-spacing:-0.01em; }
  p { color:var(--muted); font-size:0.92rem; margin:0; }
</style>
</head>
<body>
  <div>
    <h1>Kota Venkata Bharghav</h1>
    <p>3D Vision &middot; Event-Based Computing &middot; Robotics</p>
